# 工具链锁定（必须）
#
# 下限：gpui-kit 0.8.0 依赖的 gpui-pre 0.3.9 在 src/profiler.rs 使用了
# `std::hint::cold_path()`，该函数在 rustc 1.98 才稳定（rust-lang#136873）。
# 低于该版本编译会报 E0658「use of unstable library feature `cold_path`」。
#
# 当前锁定 1.99.1（2026-10-21 升级，2026-10-13 发布）：
# - 实测 47 上 `cargo check -p lengsuo-desktop --features ui --all-targets` 通过；
# - 实测 `cargo fmt --all -- --check` 通过；
# - 实测 `cargo clippy --features ui --workspace --all-targets -- -D warnings` 零警告；
# - 实测 `cargo test --features ui --workspace` 493 passed / 0 failed。
# 历史记录：1.93.0 编译失败 / 1.98.1 编译通过 / 1.99.1 编译通过。
#
# 修改本文件前请先在目标平台实跑 `cargo check -p lengsuo-desktop --features ui`。
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
