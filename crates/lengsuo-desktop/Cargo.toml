[package]
name = "lengsuo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# 阶段二：引入 GPUI 渲染层后由此 feature 隔离；阶段一纯逻辑不依赖 gpui。
# A14 起把「预览解码」四件依赖也挂在本 feature 上：解码器是接线层的一部分，
# 阶段一（纯逻辑）构建不应被它们拖慢，也不该在无 ui 的产物里出现。
ui = ["dep:gpui-kit", "dep:quick-xml", "dep:roxmltree", "dep:image", "dep:lopdf"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# GPUI 基座：gpui-kit 把上游 gpui 打成 gpui-pre 重发布（官方 gpui 依赖
# git-only 的 wgpu，无法从 registry 获取）。0.8.0 已验证在 Linux/Windows
# 均可 fetch 与 check 通过。许可证 Apache-2.0（源码），符合 AGENTS.md §6。
gpui-kit = { version = "0.8", optional = true }

# 内核管道加密依赖（p0-kernel-pipe-deps 引入，p1-kernel-pipe-core 使用）：
#   aes-gcm   —— KeyEnvelope 的 AES-256-GCM 认证加密
#   sha2      —— 机器码摘要 k_machine = SHA-256(machine_code)
#   hkdf      —— session_key = HKDF(k_machine, nonce, info=...)
#   getrandom —— 会话密钥的随机源（0.2 那套，与 rand-0.8.8 配套）
#   zeroize   —— 密钥材料离开作用域时清零
# 本卡只引入依赖、不写逻辑；实际使用在 p1-kernel-pipe-core。
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }

# profile 打包用的 zip 依赖（p3-zip-deps 引入，r-profile-sync 使用）：
#   zip —— profile 打包的 zip 容器读写（32 MiB 单包上限 ⇒ 流式写，不整包进内存）
# feature 见根 Cargo.toml 的说明：deflate-flate2-zlib-rs 是唯一能编译通过的 deflate 配法。
# 本卡只引入依赖、不写实现；实际使用在 r-profile-sync。
zip = { workspace = true }

# A14 预览器解码依赖（见根 Cargo.toml 的说明；只随 `ui` feature 构建）。
quick-xml = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
image = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }

# 桌面二进制入口：只在开 `ui` feature 时构建（否则 lib 里没有 GPUI 依赖，
# 这个 bin 编不过）。运行 `cargo run --features ui --bin lengsuo-desktop`。
# 渲染断言用的测试支撑（2026-10-22 用户批准引入）：
#
# 目的：让「接线层」能做**无窗口渲染断言**（`TestAppContext` / `HeadlessAppContext`），
# 补上本线长期缺口「只做编译验证、没有渲染验证」。
#
# 为什么走 dev-dependencies 而不是塞进 `ui` feature：
#   resolver = "2" 下 dev-dependencies 的 feature 只在**测试构建**生效
#   ⇒ `cargo build --release` 的生产二进制**零污染**（实测 normal 依赖树里
#   test-support 出现 0 次；新增的 18 个包只在 dev 树里）。
#
# 为什么只开 `gpui-pre` 的 test-support、**不**开 `gpui-kit` 的：
#   gpui-kit 的 `test-support` 会强链 `gpui_platform/test-support`
#   ⇒ 拉进 gpui-fast-platform ⇒ gpui-fast-macos 要求 `cocoa =0.26.0`（精确），
#   而锁文件里 gpui-pre-macos 要求 `cocoa ^0.26.0`（锁在 0.26.1）
#   ⇒ 语义不兼容，依赖解析必然失败（还会连带 unicode-properties 冲突）。
#   `gpui-kit` 做 `pub use ::gpui::*` ⇒ 只开 gpui-pre 的 test-support 即可用
#   `gpui_kit::TestAppContext`。代价：`gpui_kit::test` 模块（`#[gpui_kit::test]`
#   宏 / `TestWindowExt::find`）拿不到 —— 它被 gpui-kit 自己的 feature 门住。
#
# `package = "gpui-pre"`：gpui-kit 把上游 gpui 重发布成 gpui-pre，其 lib 名就是 `gpui`。
[dev-dependencies]
gpui = { version = "=0.3.9", package = "gpui-pre", features = ["test-support"] }

[[bin]]
name = "lengsuo-desktop"
path = "src/bin/lengsuo-desktop.rs"
required-features = ["ui"]
