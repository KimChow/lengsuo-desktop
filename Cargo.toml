[workspace]
resolver = "2"
members = [
    "crates/lengsuo-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Lengsuo project"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 内核管道（kernel pipe）加密依赖：p0-kernel-pipe-deps 卡引入，供后续卡
# p1-kernel-pipe-core 使用（帧编解码 / 密钥信封 / 握手状态机）。
# 版本锁定在缓存里已有的那套，避免依赖树里出现第二套 getrandom：
#   aes-gcm 0.10 的 getrandom feature 走 rand_core 0.6 → getrandom 0.2。
# aes-gcm 关掉 default-features 后显式重列 ["aes","alloc","getrandom"]，
# 与 0.10.3 的默认值集合相同，但把 feature 集固定下来不随上游默认值漂移。
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "getrandom"] }
sha2 = "0.10"
hkdf = "0.12"
getrandom = { version = "0.2", features = ["std"] }
zeroize = "1"

# profile 打包用的 zip 依赖：p3-zip-deps 卡引入，供 r-profile-sync 卡使用。
#
# feature 必须钉在 deflate-flate2-zlib-rs：
#   zip 9.x 对 flate2 的声明是 default-features = false，而 deflate-flate2
#   只开 _deflate-any、不选后端 ⇒ flate2 编译失败
#   （"You need to choose a zlib backend" + unresolved import crc32fast）。
#   deflate-flate2-zlib-rs 会带上 flate2/zlib-rs（纯 Rust 后端，不引 C 依赖），
#   且 zlib-rs 0.6.8 已在锁文件里（GPUI 图像栈拉进来的），零新增传递依赖。
#
# 关掉 default：默认 feature 集是 aes-crypto/bzip2/deflate64/lzma/ppmd/time/
# zstd/xz，本仓一个都用不到，每个都会多拉一批传递依赖（bzip2-sys、zstd-sys…）。
# 关掉后锁文件只新增 3 个包：zip / typed-path / nix（后两个是 zip 的传递依赖）。
#
# 代价：time feature 不在 ⇒ 归档条目不写真实时间戳（DOS 时间取 1980-01-01 默认值）；
#       只有 deflate(8) 与 store(0) 两种压缩方法可用（本仓只要这两种）。
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# A14 预览器「真解码」依赖（a14-preview-decode-deps 卡引入；2026-10-24 用户授权改本文件）：
#   图片 —— gpui-pre 已**非可选**依赖 image 0.25（含 png/jpeg/gif/webp/bmp 等），此处把它提升为
#           **直接依赖**，只为读像素尺寸做元信息行；渲染仍走 GPUI 自带的图像栈（⛔ 不另装图像后端）。
#   文档 —— OOXML（docx/pptx/xlsx）= zip 容器 + XML ⇒ 用已有的 zip 9 + quick-xml / roxmltree
#           （二者已在锁文件里，由 resvg 带入 ⇒ 零新增传递依赖、版本与锁一致）。
#   PDF  —— lopdf：**纯 Rust** 结构/文本解析（页数 / 元数据 / 页文本）。
#           ⛔ 不做像素级光栅化（那需 pdfium / mupdf 原生库与随包二进制，属另一档）。
# 版本一律对齐 Cargo.lock（quick-xml 0.41 / roxmltree 0.20 / image 0.25），避免第二套版本。
quick-xml = { version = "0.41", default-features = false }
roxmltree = { version = "0.20", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
lopdf = { version = "0.36", default-features = false }

[profile.dev]
incremental = false
debug = 0
strip = "debuginfo"

[profile.release]
debug = 0
strip = "debuginfo"

[profile.test]
incremental = false
debug = 0
strip = "debuginfo"

[profile.dev.build-override]
debug = 0

[profile.release.build-override]
debug = 0

[profile.test.build-override]
debug = 0
